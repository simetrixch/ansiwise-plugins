# The host plugin: steps that act on a Linux machine as a machine.
#
# This package knows TOOLS — apt, dpkg, snap, sshd, systemd, netplan, nft, ip, curl, mount,
# the MicroK8s snap — and never an application of them. No default in here names a product:
# every file path, table name or unit name a product decides is a required argument, and the
# value stands in that product's program row.
#
# The test of every step in this package: somebody with the same tool, building a completely
# different product, could use it unchanged.
name: ansiwise_host
description: Tool-generic steps that prepare and drive a Linux host.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  ansiwise_api:
    git:
      url: https://github.com/simetrixch/ansiwise-api.git
      ref: master

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
  # The scan that keeps this package to its tools and off any application of them.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-api.git
      ref: master
      path: checks
