# The host plugin: steps that act on a Linux machine as a machine.
#
# This package knows TOOLS — apt, dpkg, snap, sshd, systemd, netplan, nft, ip, curl, mount,
# the container runtime — and never an application of them. No default in here names a product:
# every file path, table name or unit name a product decides is a required argument, and the
# value stands in that product's program row.
#
# The test of every step in this package: somebody with the same tool, building a completely
# different product, could use it unchanged.
name: ansiwise_host
description: Tool-generic steps that prepare and drive a Linux host.
publish_to: none

# WHERE THE BINARY THIS PACKAGE ENDS UP IN IS COMPOSED. Nothing here produces one: a plugin declares
# steps, and which plugins a binary carries is decided by a composition root that depends on them.
# That root is ansiwise-cli, and `dart run tool/build.dart` there is what compiles the executable a
# machine is given. Named because a clone of this repository alone cannot build anything, and
# nothing else said where to look.
repository: https://github.com/simetrixch/ansiwise-plugins
version: 0.8.104

environment:
  sdk: ^3.12.0

dependencies:
  ansiwise_core:
    git:
      url: https://github.com/simetrixch/ansiwise-core.git
      ref: 9a952814adde9c2eac5c61d6ceb6c3abedf0ce9b
  # One step reads the address of an image mirror out of a profile the caller wrote. The framework
  # uses YAML for program files; a package that reads its own files declares it itself rather than
  # leaning on a transitive dependency it does not control.
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
  # The scan that keeps this package to its tools and off any application of them.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: fc636784954de23745f7906d57d92980e043c640
      path: registry
