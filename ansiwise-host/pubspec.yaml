# The host plugin: steps that act on a Linux machine as a machine.
#
# This package knows TOOLS — apt, dpkg, snap, sshd, systemd, netplan, nft, ip, curl, mount,
# the container runtime, the MicroK8s snap — and never an application of them. No default in
# here names a product:
# every file path, table name or unit name a product decides is a required argument, and the
# value stands in that product's program row.
#
# The test of every step in this package: somebody with the same tool, building a completely
# different product, could use it unchanged.
name: ansiwise_host
description: Tool-generic steps that prepare and drive a Linux host.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  # NAMED BY GIT REF like every other sibling, and not by a directory path. A path here is resolved
  # inside whatever checkout pub fetched and recorded as a commit, while the binary that composes
  # this package names the same package at a ref — and pub refuses to reconcile the two, so nothing
  # resolved from a clone at all.
  ansiwise_kubernetes:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-kubernetes
  ansiwise_api:
    git:
      url: https://github.com/simetrixch/ansiwise-api.git
      ref: master
  # One step reads the address of an image mirror out of a profile the caller wrote. The framework
  # uses YAML for program files; a package that reads its own files declares it itself rather than
  # leaning on a transitive dependency it does not control.
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
  # The scan that keeps this package to its tools and off any application of them.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: master
      path: registry
