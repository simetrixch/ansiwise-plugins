# The hostyour-cloud plugin: what should happen to a machine that becomes a hostyour-cloud installation.
#
# This is the half that knows the platform — microk8s, Vault, ArgoCD, Cloudflare. The framework it
# runs on knows none of it, the dependency points one way, and a check enforces that direction.
#
# It is also where the binary is built. A plugin's steps have to be compiled in, because Dart
# ahead-of-time loads no code at run time — so the composition root lives with the plugin set it
# composes, and `dart run tool/build.dart` produces what a machine is given.
name: hostyour_cloud
description: The steps, predicates and programs of a hostyour-cloud installation.
publish_to: none
version: 0.1.0

# The name the binary carries onto a machine, and the name its own help text prints. It is the
# framework that runs, with this plugin among the ones compiled into it.
executables:
  ansiwise: ansiwise

environment:
  sdk: ^3.12.0

dependencies:
  # The tool plugins this platform stands on. It knows what to deploy; they know how to drive a
  # cluster, a chart, a secret store, a checkout and a machine — and none of them knows this
  # platform.
  ansiwise_kubernetes:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-kubernetes
  ansiwise_vault:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-vault
  ansiwise_helm:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-helm
  ansiwise_host:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-host
  ansiwise_git:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-git
  ansiwise_api:
    git:
      url: https://github.com/simetrixch/ansiwise-api.git
      ref: master
  # Two steps read YAML the platform wrote — a chart's values and a cluster profile. The framework
  # uses it for program files; a plugin that reads its own files declares it itself rather than
  # leaning on a transitive dependency it does not control.
  yaml: ^3.1.3
  # The plugin ships the command line that starts a run, and that parses arguments itself.
  args: ^2.7.0

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
  # The audits that decide whether this plugin holds the framework's contract. They used to be
  # copied into test/checks/ here; the copies drifted, and a repair made in one was absent from the
  # other with nothing reporting it. What stays here is the wiring that points them at THIS
  # registry and tree, the fixtures, and every counter-probe.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-api.git
      ref: master
      path: checks
  # The checks under test/checks/ walk this tree and resolve the paths its imports name. Nothing
  # under tool/ may reach it — the gate has to start before anything is resolved — and none of it is
  # shipped, so it is a development dependency.
  path: ^1.9.1
