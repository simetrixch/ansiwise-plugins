# The helm plugin: the steps that drive one machine's helm.
#
# It knows the tool and never an application of it. Which repositories exist, which releases are
# installed, at which pinned versions, into which namespaces, configured by which values files —
# all of that is a program row's to say.
name: ansiwise_helm
description: Steps that register helm chart repositories and converge pinned helm releases.
publish_to: none

# WHERE THE BINARY THIS PACKAGE ENDS UP IN IS COMPOSED. Nothing here produces one: a plugin declares
# steps, and which plugins a binary carries is decided by a composition root that depends on them.
# That root is github.com/simetrixch/ansiwise-cli, and `dart run tool/build.dart` there is what
# compiles the executable a machine is given. Named because a clone of this repository alone cannot
# build anything, and nothing else said where to look.
repository: https://github.com/simetrixch/ansiwise-plugins
version: 0.6.10

environment:
  sdk: ^3.12.0

dependencies:
  ansiwise_core:
    git:
      url: https://github.com/simetrixch/ansiwise-core.git
      ref: 0.6.2-beta-20260830153758
  # The release step compares the values file a row names with what the release currently holds,
  # and that file is YAML. A plugin that reads its own files declares the parser itself rather than
  # leaning on a transitive dependency it does not control.
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.31.2
  # The analysis rule set this package includes ends at package:lints/recommended.yaml, and a
  # nested include resolves through THIS package's dependency graph.
  lints: ^6.1.0
  # The scan that keeps this package to its tool and off any application of it.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: 0.6.2-beta-20260830153957
      path: registry
