# =============================================================================
# checks — every package of this repository is linted and tested here. Nothing is
# built, tagged or released.
# =============================================================================
#
# WHAT THIS REPOSITORY IS. The steps that touch a real machine, and the passive
# parts of ansiwise-cli they belong to. It produces no binary and has no release
# of its own: the product names the COMMIT it was built from, and that commit is
# what a build resolves. So there is nothing here to publish — only something to
# judge.
#
# THE RUNNER IS build.sh, AND IT IS NOT SPELLED TWICE. That file walks the
# packages, resolves each against its own manifest, and analyses, formats and
# tests them. A copy of that walk here would be a second answer to one question,
# and the first edit on either side splits them without anything reporting it.
#
# WHY IT IS JUDGED HERE AS WELL. The release loads this tree and judges it before
# it builds anything, so a red package stops a release before a binary exists.
# That is the verdict that decides; this one answers earlier, on a push, so a
# package is found red where it was written.
#
# WHAT ONLY THIS RUN ASKS. A runner carries no pubspec_overrides.yaml, because
# that file is gitignored and lives only where somebody wrote it. So the git
# pins in every pubspec.yaml are resolved here and nowhere else, and a pin
# naming a commit the tree can no longer compile against is refused here.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: every package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE PIN IS READ OUT OF THE TREE, not written out here. One Dart version is
      # named for every gate of this organisation, in package:ansiwise_checks_gate.
      # This repository carries no gate of its own and pins that package nowhere, so
      # it reads master — the alternative is a second spelling of one version, which
      # is what drifts.
      - id: pin
        name: read the pinned Dart version
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl -fsSL \
            https://raw.githubusercontent.com/simetrixch/ansiwise-checks/master/gate/lib/src/pins.dart \
            | sed -n "s/^const String dartVersion = '\(.*\)';\$/\1/p")"
          test -n "$version" || { echo "checks: FAIL — no Dart pin could be read"; exit 1; }
          echo "dart=$version" >> "$GITHUB_OUTPUT"
          echo "checks: the pinned Dart is $version"

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: ${{ steps.pin.outputs.dart }}

      - name: analyse, format and test every package
        shell: bash
        run: bash build.sh
