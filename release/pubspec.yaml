# The release surface of this repository, and nothing else.
#
# WHY IT IS A PACKAGE BESIDE THE PLUGINS RATHER THAN A DIRECTORY ABOVE THEM. A release here is ONE
# tag carrying every package of this repository, so the program that cuts it belongs to no single
# plugin — putting it in one would make that plugin the odd one out and would tie the repository's
# release to whoever happened to own it. And a bare `tool/` at the repository root could not be
# checked: `dart test` is what runs a check in this tree, and `dart test` needs a package to run in.
# So the release lives in a package of its own, and its checks run the same way every plugin's do.
#
# IT DECLARES NO VERSION, ON PURPOSE. A version here states what a consumer is holding, and nobody
# holds this: it ships no library, exports nothing, and is nobody's dependency. The versions a
# release bumps are the ones in the `ansiwise-<tool>/` directories beside this one, which is what
# tool/release_packages.dart walks.
name: ansiwise_plugins_release
description: The program that cuts one tag for every package of this repository, and its checks.
publish_to: none

repository: https://github.com/simetrixch/ansiwise-plugins

environment:
  sdk: ^3.12.0

# NO DEPENDENCIES, and that is a property of the programs rather than an omission. Everything under
# tool/ imports nothing but `dart:` and its own directory, so no `package:` import has to be resolved
# for one of them to start. The dev dependencies below are the checks' and are not reached by them —
# but `dart run` inside a package resolves those too, which is why the workflow asks for it by name
# rather than letting it happen inside a step named for something else.

dev_dependencies:
  test: ^1.31.2
  # The analysis rule set this package includes ends at package:lints/recommended.yaml, and a
  # nested include resolves through THIS package's dependency graph.
  lints: ^6.1.0
  # The audits every package of this tree is judged by. The TREE half only: the registry half knows
  # the framework's types and drives a plugin's steps, and this package has neither.
  ansiwise_checks_tree:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: 0.1.0-alpha-20260822220752
      path: tree
