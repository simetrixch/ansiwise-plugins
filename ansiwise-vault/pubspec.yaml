# The vault plugin: the steps that drive one Vault over its HTTP API.
#
# It knows the tool and never an application of it. Where the profile and the credential file
# stand, under which keys the profile carries its values, which mounts, policies, roles and
# entries exist — all of that is a program row's to say. This package carries no default that
# belongs to any one product's file layout.
name: ansiwise_vault
description: Steps that initialize, unseal and shape one Vault over its HTTP API.
publish_to: none

# WHERE THE BINARY THIS PACKAGE ENDS UP IN IS COMPOSED. Nothing here produces one: a plugin declares
# steps, and which plugins a binary carries is decided by a composition root that depends on them.
# That root is github.com/simetrixch/ansiwise-cli, and `dart run tool/build.dart` there is what
# compiles the executable a machine is given. Named because a clone of this repository alone cannot
# build anything, and nothing else said where to look.
repository: https://github.com/simetrixch/ansiwise-plugins
version: 0.6.5

environment:
  sdk: ^3.12.0

dependencies:
  ansiwise_core:
    git:
      url: https://github.com/simetrixch/ansiwise-core.git
      ref: 0.6.1-beta-20260829215011
  # The steps read the profile a deployment wrote, and that file is YAML. A plugin that reads its
  # own files declares the parser itself rather than leaning on a transitive dependency it does
  # not control.
  yaml: ^3.1.3
  # The digest an SSH public key fingerprint is, declared here for the same reason as the parser
  # above: this package computes one itself and does not lean on a transitive dependency.
  crypto: ^3.0.7
  # Ed25519, for the one step that mints a key pair rather than a random value. The curve
  # arithmetic that turns a seed into a public key is not something to write by hand: a subtle
  # error yields a key pair whose halves do not match, which no test of ours would notice and
  # which shows up as a login refused months later.
  cryptography: ^2.9.0

dev_dependencies:
  test: ^1.31.2
  # The analysis rule set this package includes ends at package:lints/recommended.yaml, and a
  # nested include resolves through THIS package's dependency graph.
  lints: ^6.1.0
  # The scan that keeps this package to its tool and off any application of it.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: 0.6.1-beta-20260829215216
      path: registry
