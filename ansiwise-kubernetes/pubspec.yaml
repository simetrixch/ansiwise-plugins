# The kubernetes plugin: the steps that drive a cluster through kubectl.
#
# This is the half that knows the TOOL. It knows how kubectl is invoked, what its subcommands do,
# and what the objects it drives call themselves — kube-system, cert-manager, default-ipv4-ippool
# are the names those tools gave themselves. It knows no application of the tool: no default here
# names a product, a path of one installation, or a key of one configuration. Where a value belongs
# to an installation, the argument is required and the value stands in that installation's program
# row.
name: ansiwise_kubernetes
description: Steps that drive a Kubernetes cluster through kubectl, for any product built on one.
publish_to: none

# WHERE THE BINARY THIS PACKAGE ENDS UP IN IS COMPOSED. Nothing here produces one: a plugin declares
# steps, and which plugins a binary carries is decided by a composition root that depends on them.
# That root is ansiwise-cli, and `dart run tool/build.dart` there is what compiles the executable a
# machine is given. Named because a clone of this repository alone cannot build anything, and
# nothing else said where to look.
repository: https://github.com/simetrixch/ansiwise-plugins
version: 0.8.104

environment:
  sdk: ^3.12.0

dependencies:
  ansiwise_core:
    git:
      url: https://github.com/simetrixch/ansiwise-core.git
      ref: a11d358266c6c6b9ab9406216dd2080e8d80c2d7

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
  # The scan that keeps the composer the one place a kubectl invocation is spelled.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: 80dde83d57244c0d3c168ad0fd7e25ffa69094b2
      path: registry
