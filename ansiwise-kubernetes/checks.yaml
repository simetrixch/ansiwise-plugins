# Every check this package makes, and the file that carries it.
#
# WHY THIS FILE EXISTS. `dart test` discovers whatever is on disk and reports whether any of it
# failed. Delete a check file and nothing fails: the check is simply not there, and the run prints
# that every check is green. It is worse than a missing test, because a check and its counter-probe
# live in the same file — the thing that would have noticed goes with the thing it was watching.
#
# So the suite does not ask the disk what it checks. It is told here, and
# test/checks/declared_checks_test.dart holds the disk against this file, naming whatever vanished.
#
# FORMAT. `<check>: <file, relative to this file>`, one per line, the reason on the comment line
# directly above it. It is read line by line and the reader imports nothing but dart:io, because the
# same reading is done by gate programs that have to start on a fresh clone where no package has been
# resolved.
#
# ADDING A CHECK MEANS ADDING A LINE. A check file that is not declared here is reported too: an
# undeclared check is one nobody agreed to, and it is how a suite grows a file that judges nothing.

# The analyzer with infos and warnings fatal and the formatter find nothing to change in this
# package's own tree.
analysis: test/checks/analysis_test.dart
# Every Dart directive of this package spells the path it names byte for byte, so a build for Linux
# opens what a build for Windows opened.
case-sensitivity: test/checks/case_sensitivity_test.dart
# The values a probe hands the steps are the kinds and defaults the shipped programs declare, so it
# plants what an installation plants.
declared-answers: test/checks/declared_answers_test.dart
# This file agrees with the suite on disk, and the refusal that enforces it can really go red.
declared-checks: test/checks/declared_checks_test.dart
# No registered step can complete a mutation under --mode dry.
dry-safety: test/checks/dry_safety_test.dart
# Nothing in the shipped library outside infrastructure/ reaches the machine directly.
exec-confinement: test/checks/exec_confinement_test.dart
# A second run of every registered step does nothing, or the step is named as unproven.
idempotence: test/checks/idempotence_test.dart
# Every command this package composes for a cluster carries the pieces the tool needs, in order.
kubectl-composer: test/checks/kubectl_composer_test.dart
# What .gitattributes declares LF is LF in the working copy.
line-endings: test/checks/line_endings_test.dart
# No abolished word stands in a file name, a directory name or a sub-command.
naming: test/checks/naming_test.dart
# Every step this package ships is registered, and every entry names a step that is there.
registry-completeness: test/checks/registry_completeness_test.dart
# Every reversible step takes its own work back, and every irreversible one says why it cannot.
reversibility: test/checks/reversibility_test.dart
# This package names its tools and never an application of them.
tool-purity: test/checks/tool_purity_test.dart

# An argument a step accepts is an argument something reads. A row naming one the step declares and
# never reads is ACCEPTED and then ignored — the row runs, does nothing about it, and reports
# success.
declared-arguments: test/checks/declared_arguments_test.dart

# What a row grants a step is carried all the way to the act: no step reads an argument it does not
# declare, and a file carrying the elevation field passes it to every files-port call.
carried-arguments: test/checks/carried_arguments_test.dart

# A reading that could not be taken never becomes a satisfied answer. A refused command comes back
# looking exactly like "there is nothing there", and the refusal is followed from the branch it
# opens, through every bare value it is folded into, to the claim it reaches. A measurement that
# folds a refused reading into the null that means "this machine steers nothing" makes every step
# behind it answer Satisfied over a machine nobody measured.
refused-reading: test/checks/refused_reading_test.dart
captured-refusal: test/checks/captured_refusal_test.dart
