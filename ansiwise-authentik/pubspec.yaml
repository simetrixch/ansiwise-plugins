# The identity provider plugin: steps that know how authentik names and serves the things it stands
# in front of.
#
# This package knows the TOOL and never an application of it. Which applications exist, what they
# are called, which subdomain the provider is served under and which cluster's domain that sits on
# are all a program row's to say — this knows only the shapes authentik itself defines.
#
# The test of every step in this package: somebody running the same identity provider, in front of a
# completely different set of applications, could use it unchanged.
name: ansiwise_authentik
description: Tool-generic steps for an authentik identity provider.
publish_to: none

# WHERE THE BINARY THIS PACKAGE ENDS UP IN IS COMPOSED. Nothing here produces one: a plugin declares
# steps, and which plugins a binary carries is decided by a composition root that depends on them.
# That root is ansiwise-cli, and `dart run tool/build.dart` there is what compiles the executable a
# machine is given. Named because a clone of this repository alone cannot build anything, and
# nothing else said where to look.
repository: https://github.com/simetrixch/ansiwise-plugins
version: 0.8.104

environment:
  sdk: ^3.12.0

dependencies:
  ansiwise_core:
    git:
      url: https://github.com/simetrixch/ansiwise-core.git
      ref: 65e715f9f844be64a6f61ae697ed2ba40aa1522d
  # A row may take a value out of a settings file of the machine instead of being handed it as an
  # answer, and that file is YAML. A package that reads its own files declares the parser itself
  # rather than leaning on a transitive dependency it does not control.
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.31.2
  # The analysis rule set this package includes ends at package:lints/recommended.yaml, and a
  # nested include resolves through THIS package's dependency graph.
  lints: ^6.1.0
  # The scan that keeps this package to its tool and off any application of it.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: d3ff17852ec0a4ce0128d9397a8959830b9a0f39
      path: registry
