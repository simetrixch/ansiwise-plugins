# The headscale plugin: the coordinator's side of a private network — the admin surface that mints
# the credential a machine joins with.
#
# The CLIENT'S side lives in the host plugin, because the client is a tool of the machine being
# installed. The coordinator is a different tool on a different machine: its admin surface answers
# only where the coordinator runs, and HOW it is reached there — plainly on a path, or through the
# exec of whatever runs it as a workload — is one installation's arrangement, so the whole
# invocation is an argument and this package spells no word of it.
#
# It knows the coordinator's own grammar — users, pre-auth keys, their single-use and their expiry —
# and never an application of it. Which machine gets a user, how long a key stays redeemable and
# where the minted credential is put for the caller are a program row's to say.
name: ansiwise_headscale
description: Steps that drive a headscale coordinator's admin surface.
publish_to: none

# WHERE THE BINARY THIS PACKAGE ENDS UP IN IS COMPOSED. Nothing here produces one: a plugin declares
# steps, and which plugins a binary carries is decided by a composition root that depends on them.
# That root is github.com/simetrixch/ansiwise-cli, and `dart run tool/build.dart` there is what
# compiles the executable a machine is given. Named because a clone of this repository alone cannot
# build anything, and nothing else said where to look.
repository: https://github.com/simetrixch/ansiwise-plugins
version: 0.6.5

environment:
  sdk: ^3.12.0

dependencies:
  ansiwise_core:
    git:
      url: https://github.com/simetrixch/ansiwise-core.git
      ref: 0.6.1-beta-20260829215011

dev_dependencies:
  test: ^1.31.2
  # The analysis rule set this package includes ends at package:lints/recommended.yaml, and a
  # nested include resolves through THIS package's dependency graph.
  lints: ^6.1.0
  # The scan that keeps this package to its one tool and off any application of it.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: 0.6.1-beta-20260829215216
      path: registry
